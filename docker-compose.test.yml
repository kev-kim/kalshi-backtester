version: "3.9"

# Ephemeral Postgres for integration tests.
# Usage: docker compose -f docker-compose.test.yml up -d
#        pytest tests/
#        docker compose -f docker-compose.test.yml down -v

services:
  postgres-test:
    image: pgautoupgrade/pgautoupgrade:16-alpine
    environment:
      POSTGRES_DB: kalshi_test
      POSTGRES_USER: kalshi_test
      POSTGRES_PASSWORD: kalshi_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalshi_test -d kalshi_test"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    tmpfs:
      - /var/lib/postgresql/data   # in-memory; discarded on container stop
