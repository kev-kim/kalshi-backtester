x-common-env: &common-env
  KALSHI_ENV: ${KALSHI_ENV:-demo}
  KALSHI_API_KEY_ID: ${KALSHI_API_KEY_ID}
  KALSHI_PRIVATE_KEY_PATH: /run/secrets/kalshi_private_key
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-kalshi}
  POSTGRES_USER: ${POSTGRES_USER:-kalshi}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DSN: postgresql://${POSTGRES_USER:-kalshi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kalshi}
  DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ORDERBOOK_POLL_INTERVAL_MS: ${ORDERBOOK_POLL_INTERVAL_MS:-1000}
  DISCOVERY_INTERVAL_SEC: ${DISCOVERY_INTERVAL_SEC:-60}

secrets:
  kalshi_private_key:
    file: ${KALSHI_PRIVATE_KEY_PATH:-./secrets/kalshi_private_key.pem}

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kalshi}
      POSTGRES_USER: ${POSTGRES_USER:-kalshi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Enable pg_partman background worker for automatic partition creation
    command: >
      postgres
      -c shared_preload_libraries=pg_partman_bgw
      -c pg_partman_bgw.interval=3600
      -c pg_partman_bgw.dbname=${POSTGRES_DB:-kalshi}
      -c pg_partman_bgw.role=${POSTGRES_USER:-kalshi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kalshi} -d ${POSTGRES_DB:-kalshi}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  collector:
    build:
      context: .
      dockerfile: Dockerfile
    command: collector
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
    secrets:
      - kalshi_private_key
    healthcheck:
      test: ["CMD", "python", "-c",
             "import asyncio,asyncpg,os; asyncio.run(asyncpg.connect(os.environ['POSTGRES_DSN']))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    command: monitor
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
    secrets:
      - kalshi_private_key
    healthcheck:
      test: ["CMD", "python", "-c",
             "import asyncio,asyncpg,os; asyncio.run(asyncpg.connect(os.environ['POSTGRES_DSN']))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:8080:8080"
    profiles:
      - dev

volumes:
  postgres_data:
    driver: local
